<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clash Royale Quiz</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="left">
          <span class="logo">Clash Royale Quiz</span>
          <div class="lang-toggle">
            <button id="enBtn" class="lang active">EN</button>
            <button id="arBtn" class="lang">AR</button>
          </div>
        </div>
        <div class="right">
          <div id="progress" class="progress">Question 1 / 10</div>
          <div id="timer" class="timer">
            <div id="timerBar" class="timer-bar"></div>
            <div id="timerText" class="timer-text">15s</div>
          </div>
        </div>
      </header>

      <main class="quiz-card">
        <div id="quiz-container">
          <h1 id="question">Question text</h1>
          <div id="answers" class="answers"></div>

          <div class="footer-bar">
            <button id="next-btn" class="next-btn hidden">Next</button>
          </div>
        </div>

        <div id="result" class="result hidden">
          <h2>Quiz Finished!</h2>
          <p id="score-text"></p>
          <div id="score-anim" class="score-anim">0</div>
          <button id="restart-btn" class="restart-btn">Play Again</button>
        </div>
      </main>

      <footer class="credit">Made by Abdulrahman</footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
